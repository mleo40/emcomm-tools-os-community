---
# EmComm Tools installer. Debian's settings (calamares-settings-debian 12.0.9)
# with ETC's branding and three additions, marked ETC.
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
# ETC: optional software page (encryption tools, unchecked by default).
- id: crypto
  module: packagechooser
  config: packagechooser-crypto.conf
# ETC: installs the encryption tools offline if they were selected.
- id: crypto
  module: contextualprocess
  config: contextualprocess-crypto.conf
# ETC: et-data primary group and SSH host keys in the new system.
- id: etc-setup
  module: shellprocess
  config: shellprocess-etc-setup.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@crypto
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  # Before users, so the new user's home gets the encryption guides.
  - contextualprocess@crypto
  - users
  - shellprocess@etc-setup
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - luksbootkeyfile
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished

branding: emcomm-tools
prompt-install: false
dont-chroot: false
