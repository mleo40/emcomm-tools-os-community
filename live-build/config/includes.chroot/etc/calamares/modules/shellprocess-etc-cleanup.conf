---
# ETC: last step in the new system. Removes the installer's settings and ETC's
# live-session helpers, which only the live session uses.
dontChroot: false
timeout: 60
script:
    - "rm -rf /etc/calamares"
    - "rm -f /usr/local/sbin/et-carry-live-settings /usr/local/bin/et-trust-live-installer /etc/xdg/autostart/et-trust-live-installer.desktop /usr/lib/live/config/2500-etc-installer-polkit"
    - "rmdir -p --ignore-fail-on-non-empty /usr/lib/live/config"
