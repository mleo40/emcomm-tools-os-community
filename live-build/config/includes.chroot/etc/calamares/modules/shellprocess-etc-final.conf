---
# ETC: last steps in the new system, after sources-final:
# - et-data as the new user's primary group (also regroups the files carried
#   over from the live session), and SSH host keys;
# - restore contrib and non-free in apt sources (Debian's installer drops them);
# - remove the installer's settings and ETC's live-session helpers, which only
#   the live session uses.
dontChroot: false
timeout: 300
script:
    - "/opt/emcomm-tools/bin/et-fix-primary-group"
    - "command -v ssh-keygen >/dev/null 2>&1 && ssh-keygen -A || true"
    - "sed -i -E '/^deb(-src)? /s/ main( non-free-firmware)?$/ main contrib non-free non-free-firmware/' /etc/apt/sources.list"
    - "rm -rf /etc/calamares"
    - "rm -f /usr/local/sbin/et-carry-live-settings /usr/local/bin/et-trust-live-installer /etc/xdg/autostart/et-trust-live-installer.desktop /usr/lib/live/config/2500-etc-installer-polkit /etc/systemd/system/ssh.service.d/etc-no-live-ssh.conf"
    - "rmdir --ignore-fail-on-non-empty /etc/systemd/system/ssh.service.d"
    - "rmdir -p --ignore-fail-on-non-empty /usr/lib/live/config"
