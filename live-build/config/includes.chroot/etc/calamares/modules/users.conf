---
# Debian's users.conf (calamares-settings-debian 12.0.9) with ETC's groups:
# et-data and the EXTRA_GROUPS from /etc/adduser.conf (dialout, tty, users).
# et-data becomes the primary group in a later step (shellprocess@etgroups).
defaultGroups:
    - name: et-data
      must_exist: false
      system: true
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - dialout
    - tty
    - users
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
