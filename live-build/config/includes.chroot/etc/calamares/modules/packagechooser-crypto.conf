---
# ETC: optional encryption tools. Nothing is selected by default. With
# method 'legacy', the choice is stored as 'packagechooser_crypto', which
# contextualprocess-crypto.conf acts on.
mode: optional
method: legacy
id: crypto
labels:
    step: "Optional software"
items:
    # Empty id: what's shown while nothing is selected.
    - id: ""
      name: "No optional software"
      description: "Optional. Nothing extra is installed unless you select it in the list. Click Next to skip."
    - id: crypto
      name: "Encryption tools"
      description: "GNU Privacy Assistant, Paranoia File & Text Encryption, VeraCrypt, steghide, gpg, and the encryption guides. Encryption laws differ by country: do not select these tools where possessing or using them is illegal. You are responsible for following your local laws. Amateur radio rules in most countries also prohibit transmitting encrypted messages. The tools are only installed if you select them here."
