---
# ETC: optional encryption tools. Nothing is selected by default. With
# method 'legacy', the choice is stored as 'packagechooser_crypto', which
# contextualprocess-crypto.conf acts on (only 'crypto' installs anything).
mode: optional
method: legacy
id: crypto
labels:
    step: "Optional software"
items:
    # Empty id: the default (nothing selected); also listed, as the "skip"
    # choice.
    - id: ""
      name: "Skip encryption tools"
      description: "Encryption tools are not selected and won't be installed. To install them, click \"Install encryption tools\" on the left. Otherwise, click Next."
    - id: crypto
      name: "Install encryption tools"
      description: "Selected: these will be installed. GNU Privacy Assistant, Paranoia File & Text Encryption, VeraCrypt, steghide, gpg, and the encryption guides. Encryption laws differ by country: do not select these tools where possessing or using them is illegal. You are responsible for following your local laws. Amateur radio rules in most countries also prohibit transmitting encrypted messages. To leave them out, click \"Skip encryption tools\"."
