---
# ETC: runs in the new system only if "Encryption tools" was selected on the
# Optional software page. Installs from the files carried in the ISO; no
# network needed.
dontChroot: false
timeout: 1800
packagechooser_crypto:
    crypto:
        - "/opt/emcomm-tools/add-ons/crypto/scripts/install-crypto.sh --offline"
