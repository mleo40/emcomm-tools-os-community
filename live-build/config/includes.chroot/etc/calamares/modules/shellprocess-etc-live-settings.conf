---
# ETC: if the user saved their callsign, grid and Winlink password in the live
# session, copy them to the new user so the setup doesn't appear again after
# install. Runs in the live session (it reads the live user's home).
dontChroot: true
timeout: 60
script:
    - "/usr/local/sbin/et-carry-live-settings @@ROOT@@ @@USER@@"
