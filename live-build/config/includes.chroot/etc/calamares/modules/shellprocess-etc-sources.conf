---
# ETC: Debian's sources-final step rewrites /etc/apt/sources.list with only
# 'main non-free-firmware'. Restore ETC's components (contrib and non-free
# too, as in overlay/etc/apt/sources.list) so those packages keep getting
# updates.
dontChroot: false
timeout: 60
script:
    - "sed -i -E '/^deb(-src)? /s/ main( non-free-firmware)?$/ main contrib non-free non-free-firmware/' /etc/apt/sources.list"
