---
# ETC: setup in the new system, after the user is created.
# - Calamares creates users with a personal primary group ('useradd -U').
#   Make et-data their primary group, as /etc/adduser.conf does for users
#   made with adduser.
# - The image has no SSH host keys (live-build removes them so every system
#   gets its own). Create them, or the SSH server won't start.
dontChroot: false
timeout: 300
script:
    - "/opt/emcomm-tools/bin/et-fix-primary-group"
    - "command -v ssh-keygen >/dev/null 2>&1 && ssh-keygen -A || true"
