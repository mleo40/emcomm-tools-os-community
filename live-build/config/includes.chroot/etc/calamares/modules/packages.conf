---
# ETC: Debian's list (calamares-settings-debian) plus 'calamares', so the
# installed system doesn't keep the installer ("Install System"), as r7's
# Ubiquity removed itself. Runs in the new system, before ETC's cleanup step.
backend: apt
operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
      - 'calamares'
